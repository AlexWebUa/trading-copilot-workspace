[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    # Windows ships no system timezone database, so zoneinfo.ZoneInfo() raises
    # ZoneInfoNotFoundError there. backtest/engine.py builds _KYIV_TZ and
    # _NY_TZ at MODULE level, so without this the whole backtest package fails
    # to import — not a test, the import. (journal/record.py sidesteps it by
    # using pytz, which bundles its own database.)
    "tzdata>=2024.1; sys_platform == 'win32'",
    "smartmoneyconcepts>=0.0.26",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[project.scripts]
copilot = "copilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
